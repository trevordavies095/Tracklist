name: Post-Merge Validation

on:
  push:
    branches: [main, develop]

env:
  PYTHON_VERSION_DEFAULT: "3.11"

jobs:
  validate:
    name: Post-Merge Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION_DEFAULT }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Quick smoke test
        env:
          TESTING: "true"
        run: |
          # Run a subset of critical tests to ensure merge didn't break anything
          pytest tests/test_basic.py tests/test_app_simple.py -v

      - name: Verify Docker build succeeded
        run: |
          echo "Checking if Docker image was built and pushed successfully..."
          # This is handled by the docker-publish workflow
          echo "Docker workflow status can be checked in the Actions tab"

      - name: Notify on failure
        if: failure()
        run: |
          echo "⚠️ Post-merge validation failed!"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          # Add notification integration here (Slack, Discord, etc.)
